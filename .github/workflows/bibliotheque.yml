# Bibliothèque de l'Observatoire : images (Wikidata/Commons) et petits corps (JPL).
# Se relance quand on modifie les listes d'objets ou les scripts, à la demande, et une fois par mois.
# Ne télécharge une image que si le fichier source a changé ; ne publie que s'il y a du nouveau.
name: Bibliothèque (images et petits corps)

on:
  push:
    branches: [main]
    paths:
      - 'data/images-sources.json'
      - 'data/smallbodies-sources.json'
      - 'tools/images.py'
      - 'tools/smallbodies.py'
      - '.github/workflows/bibliotheque.yml'
  schedule:
    - cron: '41 3 2 * *'      # le 2 de chaque mois vers 3 h 41 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bibliotheque
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow (conversion WebP)
        run: pip install --quiet pillow
      - name: Images
        continue-on-error: true
        run: python3 tools/images.py
      - name: Petits corps
        continue-on-error: true
        run: python3 tools/smallbodies.py
      - name: Publier si quelque chose a changé
        if: always()
        run: |
          git add data/images.json data/images-report.md data/smallbodies.json data/smallbodies-report.md assets/img 2>/dev/null || true
          if git diff --cached --quiet; then echo "Rien de neuf."; exit 0; fi
          git config user.name "observatoire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bibliothèque : images et petits corps du $(date -u +%F)"
          git pull --rebase --quiet || true
          git push
